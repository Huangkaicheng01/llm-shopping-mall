<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 精选商城</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-stack" role="status">
        {% for category, message in messages %}
        <p class="flash flash--{{ category }}">{{ message }}</p>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="{{ url_for('index') }}">精选商城</a>
            <nav class="header-nav">
                <a href="{{ url_for('index') }}">首页</a>
                <a href="{{ url_for('login') }}">登录</a>
            </nav>
        </div>
    </header>
    <main class="main-content auth-page__main">
        <section class="panel auth-panel">
            <h1>注册账号</h1>
            <p class="auth-panel__hint">使用邮箱与密码创建账号，姓名将显示在用户中心。</p>
            <form class="auth-form" method="post" action="{{ url_for('register') }}">
                <label class="auth-form__label" for="reg-email">邮箱</label>
                <input class="auth-form__input" id="reg-email" name="email" type="email" autocomplete="email" required value="{{ request.form.email or '' }}">

                <label class="auth-form__label" for="reg-name">姓名</label>
                <input class="auth-form__input" id="reg-name" name="name" type="text" autocomplete="name" required value="{{ request.form.name or '' }}">

                <label class="auth-form__label" for="reg-password">密码</label>
                <input class="auth-form__input" id="reg-password" name="password" type="password" autocomplete="new-password" required>

                <button type="submit" class="btn btn-primary auth-form__submit">注册</button>
            </form>
            <p class="auth-panel__footer">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
        </section>
    </main>
    <footer class="site-footer">
        <p>Shopping Platform · 演示商城</p>
    </footer>
</body>
</html>
